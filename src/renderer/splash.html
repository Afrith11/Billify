<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Billify</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }
        .logo {
            width: 180px;
            height: auto;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .loader {
            margin-top: 2rem;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        .text {
            margin-top: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../renderer/src/assets/billify.png" class="logo" alt="Billify">
        <br>
        <div class="loader"></div>
        <div class="text">Initializing Billify...</div>
    </div>
</body>
</html>
